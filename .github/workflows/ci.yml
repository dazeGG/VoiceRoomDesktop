name: Desktop CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42+ no longer downloads its binary in postinstall; fetch it
      # up front so a failed download fails here, not inside a test.
      - name: Download Electron binary
        run: npx --no install-electron

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: xvfb-run -a npm test

  build-mac:
    name: Build macOS release artifacts
    needs: validate
    # The slowest job by far. A release pull request builds it, and so can anyone
    # by hand for a change that might break macOS.
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      VOICE_ROOM_URL: ${{ vars.VOICE_ROOM_URL || 'https://voiceroom.ru' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42+ no longer downloads its binary in postinstall; fetch it
      # up front so a failed download fails here, not inside a test.
      - name: Download Electron binary
        run: npx --no install-electron

      - name: Run production Electron capture bridge smoke
        run: node --test test/electron-message-port.test.js

      - name: Build macOS app
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRoom-macOS-${{ github.sha }}
          path: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.blockmap
            dist/**/*.yml
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows release artifacts
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VOICE_ROOM_NATIVE_CAPTURE_SMOKE: '1'
      VOICE_ROOM_URL: ${{ vars.VOICE_ROOM_URL || 'https://voiceroom.ru' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup pinned Rust
        working-directory: native/voice
        run: rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/voice
          cache-targets: false
          key: x86_64-pc-windows-msvc-webrtc-a545de4-${{ hashFiles('native/voice/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Electron 42+ no longer downloads its binary in postinstall; fetch it
      # up front so a failed download fails here, not inside a test.
      - name: Download Electron binary
        run: npx --no install-electron

      - name: Run production Electron capture bridge smoke
        run: node --test test/electron-message-port.test.js

      - name: Build native voice from a clean WebRTC download
        run: node scripts/build-native-voice.js

      - name: Check native voice formatting
        run: node scripts/build-native-voice.js --cargo fmt --check

      - name: Lint native voice
        run: node scripts/build-native-voice.js --cargo clippy --release --locked --all-targets -- -D warnings

      - name: Test native voice framing
        run: node scripts/build-native-voice.js --cargo test --release --locked

      - name: Test native voice process lifecycle
        env:
          VOICE_ROOM_REQUIRE_NATIVE_VOICE: '1'
        run: node --test test/native-voice.test.js

      - name: Build native voice receive integration binaries
        run: node scripts/build-native-voice.js --cargo build --release --locked --features receive-test --bins --examples

      - name: Verify native voice receive and output recovery
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'livekit-windows.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'voice-receive-livekit'
          Invoke-WebRequest 'https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '5d071ea43339f0140d24a66f0b2ff8a7bf6c4d0dceb19b30abca835670213667') {
            throw 'LiveKit archive SHA-256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $env:VR_VOICE_TEST_LIVEKIT = Join-Path $directory 'livekit-server.exe'
          node --test test/native-voice-receive.test.js

      - name: Build Windows app
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRoom-Windows-${{ github.sha }}
          path: |
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/*.yml
          if-no-files-found: error
          retention-days: 7
