<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'; style-src 'self'; script-src 'self'; img-src https:; font-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Room Overlay</title>
    <link rel="stylesheet" href="./overlay.css">
  </head>
  <body>
    <ul class="overlay-people" id="overlayPeople" hidden></ul>
    <section class="overlay-panel" id="overlayPanel" hidden>
      <div class="overlay-panel-card" role="dialog" aria-modal="true" aria-labelledby="overlayRoom">
        <header class="overlay-panel-head">
          <div>
            <p class="overlay-panel-kicker">Voice Room</p>
            <h1 class="overlay-panel-room" id="overlayRoom">В звонке</h1>
          </div>
          <p class="overlay-panel-hint" id="overlayHint"></p>
        </header>
        <ul class="overlay-tiles" id="overlayTiles"></ul>
      </div>
    </section>
    <script src="./overlay.js"></script>
  </body>
</html>
