<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoiceRoom</title>
    <link rel="stylesheet" href="./kit/voiceroom-kit.css">
    <link rel="stylesheet" href="./update-splash.css">
  </head>
  <body>
    <main class="update-shell">
      <p class="eyebrow">VoiceRoom</p>
      <h1 class="ui-dialog__title" id="updateTitle" data-i18n="phaseChecking">Запуск</h1>
      <p class="update-message ui-empty__text" id="updateMessage" data-i18n="checkingUpdate">Проверка обновлений...</p>
      <div class="ui-progress-row" id="updateProgress" hidden>
        <div class="ui-progress-row__head ui-progress-row__head--compact">
          <span class="ui-progress-row__percent" id="updateProgressLabel" hidden aria-hidden="true"></span>
        </div>
        <div class="ui-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="updateMessage">
          <div class="ui-progress__fill" id="updateProgressBar"></div>
        </div>
      </div>
      <div class="update-actions">
        <button class="ui-button ui-button--primary ui-button--size-md" id="updateProceed" data-i18n="enterApp" type="button" hidden>Войти в приложение</button>
        <button class="ui-button ui-button--ghost ui-button--size-md" id="updateQuit" data-i18n="close" type="button" hidden>Закрыть</button>
      </div>
    </main>
    <script src="../localization/catalog.js"></script>
    <script src="./localization.js"></script>
    <script src="./update-splash.js"></script>
  </body>
</html>
