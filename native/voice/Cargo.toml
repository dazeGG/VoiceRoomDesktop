[package]
name = "voiceroom-voice"
version = "0.1.0"
edition = "2021"

[features]
receive-test = ["dep:webrtc-sys", "webrtc-sys/voice-receive-test"]

[dependencies]
livekit = { version = "=0.12.0", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc-sys = { version = "=0.3.55", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
cc = "1"

[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }
webrtc-sys = { path = "vendor/webrtc-sys" }
